<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redefinir Password — Dreamwalker Tales</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="csrf-token" content="{{ csrf_token() }}">

  <!-- Reutiliza os teus CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>

<!-- O site-body-404 já tem o fundo escuro e centra o conteúdo perfeitamente -->
<body class="site-body-404"> 

  <main class="error-404-main">
    <div class="admin-login-card">
      
      <div class="admin-login-logo">
        <img src="{{ url_for('static', filename='img/amiraldo_logo_black.png') }}" alt="Dreamwalker" class="logo-img">
      </div>
      
      <h2 class="admin-login-title">Nova Password</h2>
      <p class="admin-login-subtitle">Escolhe uma nova password segura.</p>

      <form id="reset-password-form" class="admin-login-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <!-- O token vem do Flask através do link do email -->
        <input type="hidden" id="reset-token" value="{{ token }}">
        
        <div class="admin-field">
          <label>Nova Password</label>
          <input type="password" id="new-password" required minlength="6" placeholder="Mínimo 6 caracteres">
        </div>
        
        <button type="submit" class="btn-primary admin-login-btn">GUARDAR NOVA PASSWORD</button>
      </form>
      
      <p id="reset-feedback" class="text-center mt-4 text-sm" style="color: #FF6B6B; margin-top: 15px;"></p>
    </div>
  </main>

  <script>
    document.getElementById('reset-password-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      const feedback = document.getElementById('reset-feedback');
      
      btn.disabled = true;
      btn.textContent = 'A GUARDAR...';
      feedback.textContent = '';

      const formData = new FormData();
      formData.append('token', document.getElementById('reset-token').value);
      formData.append('password', document.getElementById('new-password').value);

      try {
        const res = await fetch('/api/reset-password', { 
          method: 'POST', 
          headers: {
            'X-CSRFToken': csrfToken,},
          body: formData });
        const data = await res.json();

        if (data.success) {
          feedback.style.color = 'var(--dw-blue-bright)';
          feedback.textContent = data.message + " A redirecionar para o login...";
          // Redireciona para a home após 2 segundos
          setTimeout(() => window.location.href = '/', 2000);
        } else {
          feedback.style.color = '#FF6B6B';
          feedback.textContent = data.message;
          btn.disabled = false;
          btn.textContent = 'GUARDAR NOVA PASSWORD';
        }
      } catch (err) {
        feedback.style.color = '#FF6B6B';
        feedback.textContent = 'Erro de rede. Tenta novamente.';
        btn.disabled = false;
        btn.textContent = 'GUARDAR NOVA PASSWORD';
      }
    });
  </script>
</body>
</html>
